version: '3.9'

services:
  # ─── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medibox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medibox
      POSTGRES_PASSWORD: medibox123
      POSTGRES_DB: medibox_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medibox -d medibox_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Broker MQTT (dispositivo IoT) ───────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: medibox_mqtt
    restart: unless-stopped
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ─── API Backend ─────────────────────────────────────────
  api:
    build: .
    container_name: medibox_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://medibox:medibox123@postgres:5432/medibox_db
      JWT_SECRET: ${JWT_SECRET:-troque_em_producao}
      JWT_EXPIRES_IN: 7d
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
